name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --org com.grupowk --project-name wk_operacoes
      - name: Set WK Frentista display name
        run: |
          sed -i 's/android:label="wk_operacoes"/android:label="WK Frentista"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/WK Operações/WK Frentista/g' lib/main.dart
          sed -i 's/WK Cliente/Grupo WK/g' lib/main.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Reuse official WK launcher icon
        run: |
          mkdir -p assets/images
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/luccassxr/app_postos/main/assets/images/wk_app_icon.png \
            --output assets/images/wk_app_icon.png
      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wk-frentista-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
